
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação | Start by Alura</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Jogo de Adivinhação</h1>
        <p>Descubra o número secreto entre 1 e 100!</p>

        <form id="formulario">
            <label for="tentativa">Digite seu palpite:</label>
            <input
                type="number"
                id="tentativa"
                min="1"
                max="100"
                placeholder="Ex.: 42"
                required
            >
            <button type="submit">Tentar</button>
        </form>

        <p id="mensagem" aria-live="polite">
            Você tem 7 tentativas. Boa sorte!
        </p>

        <p id="historico">Tentativas: nenhuma</p>
        <button id="reiniciar" type="button">Novo jogo</button>
    </main>

    <script type="module" src="js/main.js"></script>
</body>
</html>
